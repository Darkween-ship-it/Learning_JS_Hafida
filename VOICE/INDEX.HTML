<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice controlled app</title>
    <style>
        body{
            font-family: sans-serif;
            text-align: center;
            padding:40px;
        }

        button{
            padding:12px 24px;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            font-size:24px;
            font-style:italic;
        }
    </style>
</head>
<body>
    <h1>Voice controled web app</h1>
    <button onclick="startListening()">Start Listening</button>
    <div id="result">Say Something...</div>
    <script>
        const resultDiv = document.getElementById("result");
        const originalStyles = {
            backgroundColor: window.getComputedStyle(document.body).backgroundColor,
            fontSize: window.getComputedStyle(resultDiv).fontSize
        };
        const speechRecognition = window.speechRecognition || window.webkitSpeechRecognition;
        if (!speechRecognition){
            resultDiv.textContent = "Speech recognition not supported in this browser:*";
        }else{
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.onresult = (event)=>{
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                resultDiv.textContent = `you said: "${transcript}"`;

                //voice commands
                if (transcript.includes("change background")){
                    document.body.style.backgroundColor = "#ffeaa7";
                }else if (transcript.includes("make text bigger")){
                    resultDiv.style.fontSize = "32px";
                }else if (transcript.includes("reset")){
                    document.body.style.backgroundColor = originalStyles.backgroundColor;
                    resultDiv.style.fontSize = originalStyles.fontSize;
                }
            };
            recognition.onerror = (event)=>{
                resultDiv.textContent = "Error occured:" +event.error;
            }
            function startListening(){
                resultDiv.textContent = "Listening...";
                recognition.start();
            }
            window.startListening = startListening;
        }
    </script>
</body>
</html>
