<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCal - Task Calendar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="app">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-bolt"></i>
                    <span>SkyCal</span>
                </div>
            </div>

            <div class="header-center">
                <button class="nav-btn" id="prevBtn">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <h2 class="current-label" id="currentLabel">August 2026</h2>
                <button class="nav-btn" id="nextBtn">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <button class="today-btn" id="todayBtn">Today</button>
            </div>

            <div class="header-right">
                <div class="view-toggle">
                    <button class="view-btn active" data-view="monthly">
                        <i class="fas fa-calendar"></i> Month
                    </button>
                    <button class="view-btn" data-view="weekly">
                        <i class="fas fa-calendar-week"></i> Week
                    </button>
                    <button class="view-btn" data-view="daily">
                        <i class="fas fa-calendar-day"></i> Day
                    </button>
                </div>
                <button class="add-btn" id="addTaskBtn">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- ─── MAIN CALENDAR AREA ─── -->
        <main class="main">

            <!-- Monthly View -->
            <div class="calendar-view" id="monthlyView">
                <div class="weekday-header">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div class="month-grid" id="monthGrid"></div>
            </div>

            <!-- Weekly View -->
            <div class="calendar-view hidden" id="weeklyView">
                <div class="week-header" id="weekHeader"></div>
                <div class="week-grid" id="weekGrid"></div>
            </div>

            <!-- Daily View -->
            <div class="calendar-view hidden" id="dailyView">
                <div class="day-header" id="dayHeader"></div>
                <div class="day-timeline" id="dayTimeline"></div>
            </div>

        </main>

        <!-- ─── SIDEBAR (task details) ─── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="sidebarTitle">Tasks</h3>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="sidebar-tasks" id="sidebarTasks">
                <div class="empty-state">
                    <i class="fas fa-cloud-moon"></i>
                    <p>No tasks yet. Click + to add one.</p>
                </div>
            </div>
        </aside>

    </div>

    <!-- ─── ADD TASK MODAL ─── -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="taskModal">
        <div class="modal-header">
            <h3><i class="fas fa-bolt"></i> New Task</h3>
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="taskForm" novalidate>
            <div class="form-group">
                <label for="taskName">Task Name</label>
                <input type="text" id="taskName" placeholder="What needs to be done?" required>
                <span class="form-error" id="nameError"></span>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="1">High</option>
                        <option value="2" selected>Medium</option>
                        <option value="3">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskDuration">Duration (min)</label>
                    <input type="number" id="taskDuration" placeholder="30" min="1" value="30">
                </div>
            </div>
            <div class="form-group">
                <label for="taskDate">Due Date</label>
                <input type="date" id="taskDate" required>
                <span class="form-error" id="dateError"></span>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-plus-circle"></i> Add Task
            </button>
        </form>
    </div>

    <!-- ─── TASK DETAIL MODAL ─── -->
    <div class="modal-overlay" id="detailOverlay"></div>
    <div class="modal detail-modal" id="detailModal">
        <div class="modal-header">
            <h3 id="detailTitle">Task Details</h3>
            <button class="modal-close" id="detailClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
