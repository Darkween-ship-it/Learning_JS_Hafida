<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Scheduler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="app">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <span>TaskFlow</span>
            </div>
            <button class="add-btn" id="addTaskBtn">
                <i class="fas fa-plus"></i> New Task
            </button>
        </header>

        <!-- ─── STATS BAR ─── -->
        <div class="stats">
            <div class="stat-card">
                <span class="stat-num" id="totalCount">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card running">
                <span class="stat-num" id="runningCount">0</span>
                <span class="stat-label">Running</span>
            </div>
            <div class="stat-card completed">
                <span class="stat-num" id="completedCount">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-card pending">
                <span class="stat-num" id="pendingCount">0</span>
                <span class="stat-label">Pending</span>
            </div>
        </div>

        <!-- ─── FILTERS ─── -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="running">Running</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- ─── TASK LIST ─── -->
        <div class="task-list" id="taskList">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-clipboard-list"></i>
                <h3>No tasks yet</h3>
                <p>Click "New Task" to get started</p>
            </div>
        </div>

    </div>

    <!-- ─── ADD TASK MODAL ─── -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="taskModal">
        <div class="modal-header">
            <h3><i class="fas fa-bolt"></i> New Task</h3>
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="taskForm" novalidate>
            <div class="form-group">
                <label for="taskName">Task Name</label>
                <input type="text" id="taskName" placeholder="What needs to be done?" required>
                <span class="form-error" id="nameError"></span>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="1">High</option>
                        <option value="2" selected>Medium</option>
                        <option value="3">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskDuration">Duration (min)</label>
                    <input type="number" id="taskDuration" placeholder="30" min="1" value="30">
                </div>
            </div>
            <div class="form-group">
                <label for="taskDate">Due Date</label>
                <input type="date" id="taskDate" required>
                <span class="form-error" id="dateError"></span>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-plus-circle"></i> Add Task
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
