<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <!-- Sign-up form start -->
    <div class="container">
        <div class="subscribe-box">
              <h1>Stay updated!</h1>

              <p id="intro">Join 60,000+ product managers receiving monthly updates on:</p>

              <div class="checklist">
                  <svg 
                  xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21"><g fill="none"><circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155"/>
                    <path stroke="#FFF" stroke-width="2" d="M6 11.381 8.735 14 15 8"/></g>
                  </svg>
                  <p>Product discovery and building what matters</p>
              </div>
              
              <div class="checklist">
                  <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21"><g fill="none"><circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155"/>
                    <path stroke="#FFF" stroke-width="2" d="M6 11.381 8.735 14 15 8"/></g>
                  </svg>
                  <p>Measuring to ensure updates are a success</p>
              </div>
              <div class="checklist">
                <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21"><g fill="none"><circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155"/>
                  <path stroke="#FFF" stroke-width="2" d="M6 11.381 8.735 14 15 8"/></g>
                </svg>
                 <p>And much more!</p>
              </div>

              <h6>Email address</h6>
              <div class="btn">
                  <input type="email" placeholder="email@company.com" >
                  <button>Subscribe to monthly newsletter</button> 
              </div>
              
        </div>
        <div class="img-container">
          <img src="illustration-sign-up-desktop.svg" alt="illustration">
        </div>
           
    </div>

  <!-- Sign-up form end -->

  
  

</body>
</html>
