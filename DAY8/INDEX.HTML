<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
            <main>
                <h1>Guessing Game</h1>
                <p>Enter a number between 1 and 10</p>
                <div>
                    <input type="number" name="input" id="value" max="10" min="1" autofocus>
                    <button type="submit" onclick="game()">Submit</button>
                </div>
                <p id="response"></p>
            </main>
    

    <script>
        let guess=Math.floor(Math.random()*10)+1;
        const inputElement =document.getElementById('value');
        const response =document.getElementById('response');
        // let i=0;
        function game(){
            let userGuess = Number(inputElement.value);

                 if(userGuess > guess){
                    if(userGuess > 10){
                        response.innerHTML="Out of range";
                    }else{
                        response.innerHTML="Too high"; 
                    }
                 }else if(userGuess < guess){
                    if(userGuess < 0){
                        response.innerHTML="Out of range";
                    }else{
                        response.innerHTML="Too low";
                    }
                 }
                 else{
                     response.innerHTML="Congratulations you've found the number";
                      document.body.p.style.color = "green";
                 }
           }
    </script>
</body>
</html>
