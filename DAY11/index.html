<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Website - Shopping Cart | Codehal</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>

<body>
    <header>
        <a href="" class="logo">Ecommerce</a>
        <div id="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span class="cart-item-count"></span>
        </div>
    </header>

    <section class="shop ">
        <h1 class="section-title">Shop Products</h1>
        <div class="product-content">
            <div class="Product-box">
                <div class="img-box">
                    <img src="product1.jpg">
                </div>
                <h2 class="product-title">Casual Black Polo</h2>
                <div class="product-and-cart">
                    <span class="price">$100</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product2.jpg">
                </div>
                <h2 class="product-title">Casual Black Polo</h2>
                <div class="product-and-cart">
                    <span class="price">$100</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product3.jpg">
                </div>
                <h2 class="product-title">Blue Sweatshirt</h2>
                <div class="product-and-cart">
                    <span class="price">$20</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product4.jpg">
                </div>
                <h2 class="product-title">Hooded Urban Jacket</h2>
                <div class="product-and-cart">
                    <span class="price">$125</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product5.jpg">
                </div>
                <h2 class="product-title">Cold Weather Jacket</h2>
                <div class="product-and-cart">
                    <span class="price">$147</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product6.jpg">
                </div>
                <h2 class="product-title">Sporty Jacket</h2>
                <div class="product-and-cart">
                    <span class="price">$80</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product7.jpg">
                </div>
                <h2 class="product-title">Olive Heritage Hoodie</h2>
                <div class="product-and-cart">
                    <span class="price">$62</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <div class="Product-box">
                <div class="img-box">
                    <img src="product8.jpg">
                </div>
                <h2 class="product-title">Bright Horizon Polo</h2>
                <div class="product-and-cart">
                    <span class="price">$70</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>
        </div>
      
</body>

</html>
