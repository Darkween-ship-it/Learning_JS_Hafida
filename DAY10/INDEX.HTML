<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping cart</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        while(true){
            let cart = ["banana","apple","pear"];
            alert("Welcome to the shopping cart");
            alert("1.add item \n 2.view the cart\n 3.remove item\n 4.chckout and see th total\n");
            let option = prompt("choose the options you wish to perform");
            if (option == 1){
                cart.push("orange");
            }
            if (option == 2){
                alert(cart);
            }
            if(option == 3){
                cart.pop();
            }
        }
    </script>
</body>
</html>
